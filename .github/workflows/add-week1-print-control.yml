name: Add Week One Print Control

on:
  push:

permissions:
  contents: write

jobs:
  add-print-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Week One print script
        shell: bash
        run: |
          FILE="studies/trees/week1.html"
          SCRIPT='<script src="week1-pdf.js"></script>'

          if ! grep -q 'week1-pdf.js' "$FILE"; then
            python3 - <<'PY'
from pathlib import Path
p = Path("studies/trees/week1.html")
s = p.read_text(encoding="utf-8")
needle = '<script src="../../script.js"></script>'
insert = '    <script src="week1-pdf.js"></script>\n\n' + needle
if 'week1-pdf.js' not in s and needle in s:
    s = s.replace(needle, insert)
    p.write_text(s, encoding="utf-8")
PY
          fi

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/trees/week1.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add Week One lesson plan print button"
            git push
          fi
