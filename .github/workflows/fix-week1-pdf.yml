name: Fix Week One PDF Link
on:
  push:
    paths:
      - '.github/workflows/fix-week1-pdf.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace print control with PDF link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('studies/trees/week1.html')
          s=p.read_text()
          s=re.sub(r'\n?\s*<script[^>]+week1-pdf\.js[^>]*></script>\s*', '\n', s, flags=re.I)
          s=re.sub(r'\s*<!--\s*WEEK ONE PRINT CONTROL.*?-->\s*', '\n', s, flags=re.I|re.S)
          marker='<div class="hero-buttons">'
          button='''<a\n  href="Trees_Study_Week_1_Lesson_Plan.pdf"\n  class="btn btn-primary"\n  target="_blank"\n  rel="noopener">\n\n📄 Week One PDF\n\n</a>'''
          if 'Trees_Study_Week_1_Lesson_Plan.pdf' not in s:
              s=s.replace(marker, marker+'\n\n'+button, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/trees/week1.html
          git diff --cached --quiet || git commit -m 'Use existing Week One PDF instead of printing page'
          git push
